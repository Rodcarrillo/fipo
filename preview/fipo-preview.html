      <footer><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Leer archivo</button></footer></form>`;
    const f = $("#imp-f", body);
    f.onsubmit = (ev) => { ev.preventDefault(); if (!f.file.files.length) return toast("Elige un archivo.", "error");
      last.file = f.file.files[0]; last.accountId = f.account_id.value; last.opts = { day_first: f.day_first.value, invert: f.invert.value }; last.mapping = null; runParse(f); };
  };

  const runParse = (btnForm) => {
    const fd = new FormData();
    fd.append("file", last.file); fd.append("account_id", last.accountId); fd.append("day_first", last.opts.day_first); fd.append("invert", last.opts.invert);
    if (last.mapping) fd.append("mapping", JSON.stringify(last.mapping));
    const b = btnForm && $("button[type=submit]", btnForm); if (b) { b.disabled = true; b.textContent = "Leyendo…"; }
    uploadForm("/api/import/parse", fd).then(stepReview).catch((er) => { toast(er.message, "error"); if (b) { b.disabled = false; b.textContent = "Leer archivo"; } });
  };

  const stepReview = (res) => {
    const rows = res.rows, cur_ = res.account.currency;
    const cats = { expense: S.categories.filter((c) => c.kind === "expense" && !c.archived), income: S.categories.filter((c) => c.kind === "income" && !c.archived) };
    const catOpts = (k, v) => `<option value="">Sin categoría</option>` + cats[k].map((c) => `<option value="${c.id}" ${c.id === v ? "selected" : ""}>${esc(c.name)}</option>`).join("");
    const canMap = res.columns && res.columns.length;
    const colOpts = (k) => `<option value="">—</option>` + res.columns.map((c, i) => `<option value="${i}" ${res.mapping && res.mapping[k] === i ? "selected" : ""}>${esc(c || "Columna " + (i + 1))}</option>`).join("");
    body.innerHTML = `<div class="note">${esc(res.filename)} → <b>${esc(res.account.name)}</b>. Encontré <b>${rows.length}</b> movimientos${rows.filter((r) => r.duplicate).length ? `; <b>${rows.filter((r) => r.duplicate).length}</b> parecen ya registrados y vienen desmarcados` : ""}. Revisa antes de guardar.</div>
      ${(res.warnings || []).map((w) => `<div class="alert warn">${icon("alert")}<span>${esc(w)}</span></div>`).join("")}
      ${canMap ? `<details style="margin-bottom:.8rem"><summary class="small" style="cursor:pointer">¿Las columnas están mal? Ajustarlas</summary><form id="map-f" class="map-grid">${[["date", "Fecha"], ["description", "Descripción"], ["amount", "Importe (una columna)"], ["debit", "Cargo"], ["credit", "Abono"], ["balance", "Saldo"]].map(([k, l]) => `<div class="field"><label>${l}</label><select name="${k}">${colOpts(k)}</select></div>`).join("")}<button class="btn sm" type="submit">Volver a leer</button></form></details>` : ""}
      ${rows.length ? `<div class="imp-scroll"><table class="imp"><thead><tr><th><input type="checkbox" id="all" checked aria-label="Seleccionar todo"></th><th>Fecha</th><th>Descripción</th><th>Categoría</th><th class="r">Importe</th></tr></thead><tbody>
        ${rows.map((r) => { const k = r.amount > 0 ? "income" : "expense"; return `<tr data-i="${r.idx}" class="${r.duplicate ? "dup" : ""}"><td><input type="checkbox" class="ck" ${r.duplicate ? "" : "checked"} aria-label="Incluir"></td><td>${esc(fmtDate(r.date, { day: "2-digit", month: "short", year: "2-digit" }))}</td>
          <td>${esc(r.description || "(sin descripción)")}${r.duplicate ? ' <span class="badge">posible duplicado</span>' : ""}${["default", "keyword"].includes(r.confidence) ? ' <span class="badge demo">verifica signo</span>' : ""}</td>
          <td><select class="cat" aria-label="Categoría">${catOpts(k, r.category_id)}</select></td><td class="r amt ${r.amount >= 0 ? "pos" : "neg"}">${esc(money(r.amount, cur_, { sign: true, mask: false }))}</td></tr>`; }).join("")}</tbody></table></div>
        <p class="small" id="imp-sum"></p>` : '<div class="empty">No se encontraron movimientos con esta configuración.</div>'}
      <footer><button class="btn" id="imp-back">Elegir otro archivo</button>${rows.length ? '<button class="btn primary" id="imp-go">Guardar movimientos</button>' : ""}</footer>`;
    $("#imp-back", body).onclick = () => stepPick();
    const mf = $("#map-f", body);
    if (mf) mf.onsubmit = (ev) => { ev.preventDefault(); const d = formData(mf); last.mapping = Object.fromEntries(Object.entries(d).filter(([, v]) => v !== "").map(([k, v]) => [k, +v])); const fd = new FormData(); fd.append("file", last.file); fd.append("account_id", last.accountId); fd.append("day_first", last.opts.day_first); fd.append("invert", last.opts.invert); fd.append("mapping", JSON.stringify(last.mapping));
      uploadForm("/api/import/parse", fd).then(stepReview).catch((er) => toast(er.message, "error")); };
    if (!rows.length) return;
    const trs = $$("tbody tr", body);
    const sum = () => { const sel_ = trs.filter((t) => $(".ck", t).checked); const tot = sel_.reduce((a, t) => a + rows[+t.dataset.i].amount, 0); $("#imp-sum", body).innerHTML = `Se guardarán <b>${sel_.length}</b> movimientos · neto <b>${esc(money(tot, cur_, { sign: true, mask: false }))}</b>`; $("#imp-go", body).disabled = !sel_.length; };
    $$(".ck", body).forEach((c) => c.onchange = sum); $("#all", body).onchange = (e) => { $$(".ck", body).forEach((c) => c.checked = e.target.checked); sum(); }; sum();
    $("#imp-go", body).onclick = async (ev) => {
      const chosen = trs.filter((t) => $(".ck", t).checked).map((t) => { const r = rows[+t.dataset.i]; return { date: r.date, description: r.description, amount: r.amount, category_id: +$(".cat", t).value || null }; });
      ev.target.disabled = true;
      try { const r = await api("POST", "/api/import/commit", { account_id: res.account.id, filename: res.filename, kind: res.kind || "", rows: chosen }); m.close(); await refreshCore(); toast(`Se importaron ${r.created} movimientos.`); route(); }
      catch (er) { toast(er.message, "error"); ev.target.disabled = false; }
    };
  };
  stepPick();
}

async function importsHistory(host, redraw) {
  const r = await api("GET", "/api/imports");
  host.innerHTML = r.imports.length ? `<h3 style="margin:1rem 0 .4rem">Importaciones recientes</h3>${r.imports.map((i) => `<div class="tx-row" style="grid-template-columns:minmax(0,1fr) auto"><span class="desc"><b>${esc(i.filename || "Archivo")}</b><span class="muted small">${esc(i.account_name)} · ${esc(fmtStamp(i.created_at))} · ${i.remaining} movimientos</span></span><button class="btn sm danger" data-undo="${i.id}">Deshacer</button></div>`).join("")}` : "";
  $$("[data-undo]", host).forEach((b) => b.onclick = async () => {
    if (!(await confirmDialog("¿Deshacer importación?", "Se eliminarán los movimientos que trajo este archivo (los que no hayas editado a mano se borran igual). Los saldos se recalculan solos.", "Deshacer"))) return;
    try { const d = await api("DELETE", "/api/imports/" + b.dataset.undo); await refreshCore(); toast(`Se eliminaron ${d.deleted} movimientos.`); redraw(); } catch (e) { toast(e.message, "error"); }
  });
}

</script>
<script>
/* FIPO - Fases 2 y 3: tarjetas, deudas, presupuestos, análisis, reportes, metas, tablas y comprobantes. */
"use strict";

const bar = (pct, cls = "") => `<div class="track" role="progressbar" aria-valuenow="${Math.round(Math.min(100, pct))}" aria-valuemin="0" aria-valuemax="100"><i class="fill ${cls}" style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
const utilCls = (p) => (p >= 80 ? "bad" : p >= 50 ? "mid" : "");
const monthKey = () => todayStr().slice(0, 7);
const shiftMonth = (k, n) => { let [y, m] = k.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${String(m).padStart(2, "0")}`; };
const monthLabel = (k) => { const [y, m] = k.split("-").map(Number); const s = new Intl.DateTimeFormat("es-MX", { month: "long", year: "numeric" }).format(new Date(y, m - 1, 1)); return s.charAt(0).toUpperCase() + s.slice(1); };
const emptyCard = (title, text, btnId, btnLabel) => `<div class="card empty"><h2 style="justify-content:center">${title}</h2><p>${text}</p>${btnId ? `<button class="btn primary" id="${btnId}">${icon("plus")} ${btnLabel}</button>` : ""}</div>`;
const dayText = (d) => (d ? fmtDate(d, { day: "numeric", month: "short" }) : "—");
const modalForm = (title, id, bodyHtml, submitLabel, onSubmit, opts = {}) => {
  const m = openModal(title, `<form id="${id}" novalidate>${bodyHtml}<footer><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">${submitLabel}</button></footer></form>`, {
    ...opts, onMount: (el) => { const f = $("#" + id, el); f.onsubmit = (e) => { e.preventDefault(); submitForm(f, async () => { await onSubmit(formData(f), m, f); }); }; if (opts.onMount) opts.onMount(el, f); } });
  return m;
};

/* ---------------------------------------------------------------- Más (móvil) */
const SECTIONS = [["cards", "Tarjetas", "card", "Límite, corte y pagos"], ["recurring", "Pagos recurrentes", "repeat", "Suscripciones que se registran solas"], ["debts", "Deudas", "debt", "Préstamos y abonos"], ["budgets", "Presupuestos", "target", "Límites por categoría"],
  ["portfolio", "Portafolio", "trend", "Inversiones y precios"], ["goals", "Metas", "flag", "Ahorro con objetivo"], ["analysis", "Análisis", "chart", "Tendencias y proyección"],
  ["reports", "Reportes", "file", "PDF y CSV del periodo"], ["tables", "Tablas", "table", "Tus propias hojas"], ["receipts", "Comprobantes", "camera", "Fotos con lectura OCR"], ["settings", "Configuración", "sliders", "Perfil, datos, seguridad"]];
function moreView() {
  const view = mountShell("more", "Más");
  const descOf = Object.fromEntries(SECTIONS.map(([k, l, ic, d]) => [k, [l, ic, d]]));
  view.innerHTML = `<div class="grid more-grid" style="margin-top:.4rem"><a class="card more-item" href="#/widgets">${icon("widgets")}<span><b>Widgets</b><span class="muted small">Tu dashboard personalizable</span></span></a></div>` + NAV_GROUPS.map((g) => {
    const items = g.items.filter(([k]) => descOf[k]);
    if (!items.length) return "";
    return `<div class="lbl" style="margin:1.1rem 0 .5rem">${esc(g.label)}</div><div class="grid more-grid">${items.map(([k]) => { const [l, ic, d] = descOf[k]; return `<a class="card more-item" href="#/${k}">${icon(ic)}<span><b>${l}</b><span class="muted small">${d}</span></span></a>`; }).join("")}</div>`;
  }).join("");
}

/* ---------------------------------------------------------------- Tarjetas */
function cardsView() {
  const view = mountShell("cards", "Tarjetas de crédito", `<button class="btn primary" id="card-new">${icon("plus")} Tarjeta</button>`);
  $("#card-new").onclick = () => accountModal(null, { type: "credit" });
  withRetry(view, async () => {
    const [r, rec] = await Promise.all([api("GET", "/api/cards"), api("GET", "/api/recurring").catch(() => ({ items: [] }))]), C = r.currency;
    if (!r.cards.length) { view.innerHTML = emptyCard("Aún no tienes tarjetas", "Registra tu tarjeta con su límite y sus días de corte y pago. Las compras se capturan como gastos en esa tarjeta y los pagos como transferencias desde tu cuenta: no cuentan como gasto dos veces.", "c-e", "Agregar tarjeta"); $("#c-e").onclick = () => accountModal(null, { type: "credit" }); return; }
    const t = r.totals;
    const recOf = (id) => rec.items.filter((x) => x.account_id === id && x.active);
    const planHtml = (p, cur) => `<div class="plan-item ${p.finished ? "done" : ""}">
        <div class="grow"><b>${esc(p.description)}</b>
          <div class="muted small">${esc(p.kind_label)} · ${p.installments_done} de ${p.months_total}${p.finished ? " · liquidado" : p.end_date ? " · termina " + esc(fmtDate(p.end_date, { month: "short", year: "numeric" })) : ""}${p.interest_per_installment ? ` · ${esc(money(p.interest_per_installment, cur))} de interés c/u` : ""}</div>
          ${bar(p.installments_done * 100 / p.months_total, p.finished ? "ok" : "")}</div>
        <div class="right"><b>${esc(money(p.monthly_amount, cur))}</b><div class="muted small">al mes</div>
          <button class="icon-btn" data-del-plan="${p.id}" data-linked="${p.transaction_id ? 1 : 0}" aria-label="Quitar plan">${icon("trash")}</button></div></div>`;
    view.innerHTML = `<div class="grid stats">
      <div class="card stat hero"><div class="k">Pago del mes (todas)</div><div class="v">${esc(money(t.pending, C))}</div><div class="n">Para no generar intereses, según tu día de corte</div></div>
      <div class="card stat"><div class="k">Deuda total en tarjetas</div><div class="v">${esc(money(t.used, C))}</div><div class="n">${t.limit ? `de ${esc(money(t.limit, C))} de límite` : "Sin límite configurado"}</div></div></div>
      <div class="grid acc-grid">${r.cards.map((c) => { const cur = c.currency, st = c.statement, active = c.plans.filter((p) => !p.finished), recs = recOf(c.id);
        return `<article class="card cc ${c.archived ? "archived" : ""}"><div class="muted small">${esc(c.institution || "Tarjeta de crédito")} · ${cur}${c.archived ? " · archivada" : ""}</div>
        <h3 style="margin:.2rem 0">${esc(c.name)}</h3>
        ${st ? `<div class="cc-pay"><div class="k">Pago del mes${c.next_due ? " · vence " + esc(dayText(c.next_due)) : ""}</div><div class="v">${esc(money(st.pending, cur))}</div>
          <div class="muted small">Corte del ${esc(dayText(st.cut_date))}: ${esc(money(st.to_pay_at_cut, cur))}${st.paid_since ? ` · ya pagaste ${esc(money(st.paid_since, cur))}` : ""}</div></div>`
          : `<div class="note small">Agrega el día de corte y el de pago (botón ${icon("edit")}) para calcular tu pago del mes.</div>`}
        <div class="cc-rows">
          <div><span>Deuda total</span><b class="${c.used ? "neg" : ""}">${esc(money(c.used, cur))}</b></div>
          ${c.deferred_now ? `<div><span>A meses (aún no se cobra)</span><b>${esc(money(c.deferred_now, cur))}</b></div>` : ""}
          ${st ? `<div><span>Compras nuevas desde el corte</span><b>${esc(money(st.new_charges, cur))}</b></div>` : ""}
          ${c.credit_in_favor ? `<div><span>Saldo a favor</span><b class="pos">${esc(money(c.credit_in_favor, cur))}</b></div>` : ""}
          <div><span>Próximo corte</span><b>${esc(dayText(c.next_cut))}</b></div>
        </div>
        ${c.limit ? `${bar(c.utilization, utilCls(c.utilization))}<div class="muted small">${c.utilization}% del límite · disponible <b>${esc(money(c.available, cur))}</b></div>` : '<div class="muted small">Define un límite para ver tu uso.</div>'}
        ${c.plans.length ? `<details class="cc-sec" ${active.length ? "open" : ""}><summary>${icon("chevron")} Compras a meses (${active.length} ${active.length === 1 ? "activa" : "activas"}${c.installments_monthly ? ` · ${esc(money(c.installments_monthly, cur))}/mes` : ""})</summary>${c.plans.map((p) => planHtml(p, cur)).join("")}</details>` : ""}
        ${recs.length ? `<details class="cc-sec"><summary>${icon("chevron")} Cargos recurrentes (${recs.length})</summary>${recs.map((x) => `<div class="plan-item"><div class="grow"><b>${esc(x.description)}</b><div class="muted small">${esc(x.frequency_label)} · próximo ${esc(dayText(x.next_date))}</div></div><div class="right"><b>${esc(money(x.amount, cur))}</b></div></div>`).join("")}<a class="small" href="#/recurring">Administrar pagos recurrentes</a></details>` : ""}
        <div class="cc-actions">${c.archived ? "" : `<button class="btn primary sm" data-pay="${c.id}">Pagar tarjeta</button><button class="btn sm" data-buy="${c.id}">Registrar compra</button>`}
          <button class="btn sm" data-more="${c.id}">${icon("plus")} Más opciones</button></div></article>`; }).join("")}</div>`;
    $$("[data-buy]", view).forEach((b) => b.onclick = () => txModal(null, { type: "expense", account_id: +b.dataset.buy }));
    $$("[data-pay]", view).forEach((b) => b.onclick = () => payCardModal(r.cards.find((c) => c.id === +b.dataset.pay)));
    $$("[data-more]", view).forEach((b) => b.onclick = () => {
      const c = r.cards.find((x) => x.id === +b.dataset.more);
      const m = openModal(c.name, `<div class="menu-list">
        <button type="button" data-a="plan">${icon("card")}<span><b>Agregar compra a meses que ya traes</b><span class="muted small">Separa de tu deuda lo que va a MSI, con intereses o diferido</span></span></button>
        <button type="button" data-a="rec">${icon("repeat")}<span><b>Agregar cargo recurrente</b><span class="muted small">Netflix, teléfono, gimnasio… se registra solo cada mes</span></span></button>
        <button type="button" data-a="mov">${icon("list")}<span><b>Ver movimientos</b></span></button>
        <button type="button" data-a="edit">${icon("edit")}<span><b>Editar tarjeta</b><span class="muted small">Límite, días de corte y de pago</span></span></button></div>`);
      m.el.addEventListener("click", (e) => { const x = e.target.closest("[data-a]"); if (!x) return; m.close();
        ({ plan: () => planModal(c), rec: () => recurringModal(null, { account_id: c.id }), mov: () => go("#/accounts/" + c.id), edit: () => accountModal(accById(c.id)) })[x.dataset.a](); });
    });
    $$("[data-del-plan]", view).forEach((b) => b.onclick = async () => {
      const linked = b.dataset.linked === "1";
      if (!(await confirmDialog("¿Quitar este plan a meses?", linked ? "La compra sigue registrada; solo dejará de separarse a meses (todo su saldo contará en el pago del mes)." : "Tu deuda total no cambia; solo dejará de separarse esa parte a meses.", "Quitar"))) return;
      try { await api("DELETE", "/api/cards/plans/" + b.dataset.delPlan); toast("Plan quitado."); route(); } catch (e) { toast(e.message, "error"); }
    });
  });
}
/* ---------------------------------------------------------------- Pagos recurrentes */
function recurringModal(item = null, preset = {}) {
  const accs = S.accounts.filter((a) => !a.archived || (item && item.account_id === a.id));
  if (!accs.length) return toast("Primero crea una cuenta o tarjeta.", "error");
  const accId = item ? item.account_id : preset.account_id || (accs.find((a) => a.type === "credit") || accs[0]).id;
  const cats = categoryOptions("expense", item ? item.category_id : null);
  modalForm(item ? "Editar cargo recurrente" : "Nuevo cargo recurrente", "rc-f", `<p class="muted small">Se registra solo el día que toca.</p>
    ${field("¿Qué es?", "description", 'maxlength="80" required placeholder="Netflix, plan del teléfono, gimnasio…"', item?.description ?? "")}
    <div class="row2">${field("Importe", "amount", 'inputmode="decimal" required placeholder="0.00"', item ? centsToInput(item.amount) : "")}${sel("frequency", "Cada cuánto", [["monthly", "Cada mes"], ["weekly", "Cada semana"], ["yearly", "Cada año"]], item?.frequency ?? "monthly")}</div>
    ${sel("account_id", "Se cobra en", accs.map((a) => [a.id, `${a.name}${a.type === "credit" ? " (tarjeta)" : ""}`]), accId)}
    ${sel("category_id", "Categoría", [["", "Sin categoría"], ...cats], item?.category_id ?? "")}
    ${field("Próximo cargo", "next_date", 'type="date" required', item?.next_date ?? todayStr())}
    <p class="muted small">Si la fecha es hoy o ya pasó, se registra en cuanto guardes.</p>`,
  item ? "Guardar" : "Programar cargo", async (d, m) => { await api(item ? "PATCH" : "POST", item ? "/api/recurring/" + item.id : "/api/recurring", d); m.close(); await refreshCore(); toast(item ? "Cargo actualizado." : "Cargo programado."); route(); });
}
function recurringView() {
  const view = mountShell("recurring", "Pagos recurrentes", `<button class="btn primary" id="rc-new">${icon("plus")} Cargo recurrente</button>`);
  $("#rc-new").onclick = () => recurringModal();
  withRetry(view, async () => {
    const r = await api("GET", "/api/recurring"), C = r.currency;
    if (!r.items.length) { view.innerHTML = emptyCard("Sin pagos recurrentes", "Programa tus suscripciones y pagos fijos (Netflix, teléfono, gimnasio, seguros…). El día que toca, FIPO los registra solos en la tarjeta o cuenta que elijas.", "rc-e", "Programar el primero"); $("#rc-e").onclick = () => recurringModal(); return; }
    view.innerHTML = `<div class="grid stats"><div class="card stat hero"><div class="k">Pagos recurrentes al mes</div><div class="v">${esc(money(r.monthly_total, C))}</div><div class="n">${r.items.filter((x) => x.active).length} activos · semanales y anuales convertidos a su equivalente mensual</div></div></div>
      <section class="card">${r.items.map((x) => `<div class="rec-row ${x.active ? "" : "paused"}">
        <span class="tx-ico ${x.active ? "expense" : ""}">${icon("repeat")}</span>
        <div class="grow"><b>${esc(x.description)}</b><div class="muted small">${esc(x.frequency_label)} · ${esc(x.account_name)}${x.category_name ? " · " + esc(x.category_name) : ""}</div>
          <div class="small">${x.active ? `Próximo: <b>${esc(fmtDate(x.next_date, { weekday: "short", day: "numeric", month: "short" }))}</b>` : '<span class="muted">En pausa</span>'}</div></div>
        <b class="rec-amt">${esc(money(x.amount, x.currency))}</b>
        <div class="rec-actions"><button class="btn sm" data-toggle="${x.id}">${x.active ? "Pausar" : "Reanudar"}</button><button class="btn sm" data-edit-rec="${x.id}">${icon("edit")} Editar</button><button class="icon-btn" data-del-rec="${x.id}" aria-label="Eliminar">${icon("trash")}</button></div></div>`).join("")}</section>`;
    const byId = (id) => r.items.find((x) => x.id === +id);
    $$("[data-toggle]", view).forEach((b) => b.onclick = async () => { const x = byId(b.dataset.toggle); try { await api("PATCH", "/api/recurring/" + x.id, { active: !x.active }); toast(x.active ? "Pausado." : "Reanudado."); route(); } catch (e) { toast(e.message, "error"); } });
    $$("[data-edit-rec]", view).forEach((b) => b.onclick = () => recurringModal(byId(b.dataset.editRec)));

function wireCalculators(view, C) {
  const num = (id) => { const v = parseFloat(($("#f-" + id, view) || {}).value); return isNaN(v) ? 0 : v; };
  const upd = () => {
    const p = num("ci-p"), pmt = num("ci-a"), r = num("ci-r") / 100 / 12, n = num("ci-y") * 12;
    const fv = n > 0 ? p * Math.pow(1 + r, n) + (r ? pmt * ((Math.pow(1 + r, n) - 1) / r) : pmt * n) : p;
    $("#ci-out", view).textContent = "Valor futuro: " + money(Math.round(fv * 100), C);
  };
  const updD = () => {
    const out = $("#cd-out", view), p = num("cd-p"), r = num("cd-r") / 100 / 12, pay = num("cd-m");
    if (p <= 0 || pay <= 0) { out.textContent = ""; return; }
    if (pay <= p * r) { out.textContent = "Ese pago no alcanza a cubrir el interés: la deuda nunca se termina de pagar."; return; }
    let bal = p, months = 0, interest = 0;
    while (bal > 0 && months < 1200) { const i = bal * r; interest += i; bal = bal + i - pay; months++; }
    out.textContent = `${months} meses para pagarla · ${money(Math.round(interest * 100), C)} de interés total`;
  };
  const updE = () => { const e = num("ce-e"), m = num("ce-m"); $("#ce-out", view).textContent = e > 0 && m > 0 ? "Objetivo: " + money(Math.round(e * m * 100), C) : ""; };
  ["ci-p", "ci-a", "ci-r", "ci-y"].forEach((id) => $("#f-" + id, view).oninput = upd);
  ["cd-p", "cd-r", "cd-m"].forEach((id) => $("#f-" + id, view).oninput = updD);
  ["ce-e", "ce-m"].forEach((id) => $("#f-" + id, view).oninput = updE);
  upd(); updD(); updE();
}

/* insights de Análisis: una frase corta por tarjeta, calculada con tus datos */
function analysisInsights(a, C) {
  const I = {}, clean = (s) => String(s || "").replace(/^\[DEMO\]\s*/, ""), short = (c) => money(c, C).replace(/\.\d\d$/, "");
  const sr = a.totals.avg_savings_rate;
  if (sr != null) I.flow = insight(sr < 0 ? `Gastas más de lo que ganas (${sr}%)` : `Ahorras ${sr}% en promedio`, sr < 0 ? "bad" : sr < 10 ? "warn" : "ok");
  const sv = a.savings_evolution, svLast = sv.length ? sv[sv.length - 1].cumulative : null, sv3 = sv.length > 3 ? sv[sv.length - 4].cumulative : null;
  if (svLast != null && sv3 != null) { const dlt = svLast - sv3; I.sav = insight(`${dlt >= 0 ? "+" : "−"}${short(Math.abs(dlt))} en 3 meses`, dlt >= 0 ? "ok" : "bad"); }
  const nw = a.networth_evolution.filter((x) => x.net_worth), n0 = nw.length ? nw[0].net_worth : 0, n1 = nw.length ? nw[nw.length - 1].net_worth : 0;
  if (nw.length > 1 && n0) { const p = ((n1 - n0) * 100) / Math.abs(n0); I.nw = insight(`${p >= 0 ? "+" : ""}${Math.round(p)}% en ${nw.length} meses`, p >= 0 ? "ok" : "bad"); }
  const de = a.debt_evolution;
  if (de.length > 1) { const d1 = de[de.length - 1].total, d0 = de[de.length - 2].total, dd = d1 - d0;
    I.debt = !d1 ? insight("Sin deudas", "ok") : dd < 0 ? insight(`Bajó ${short(-dd)} este mes`, "ok") : dd > 0 ? insight(`Subió ${short(dd)} este mes`, "bad") : insight("Igual que el mes pasado"); }
  const cur = a.categories.filter((c) => c.current > 0), tot = cur.reduce((s, c) => s + c.current, 0), top = [...cur].sort((x, y) => y.current - x.current)[0];
  if (top && tot) I.cat = insight(`${clean(top.name)}: ${Math.round((top.current * 100) / tot)}% del gasto`, (top.current * 100) / tot >= 40 ? "warn" : "");
  const up = [...a.categories].filter((c) => c.delta > 0).sort((x, y) => y.delta - x.delta)[0];
  I.catcmp = up ? insight(`${clean(up.name)} subió ${short(up.delta)}`, "warn") : a.categories.length ? insight("Nada subió vs. el mes pasado", "ok") : "";
  const at = a.asset_allocation.reduce((s, x) => s + x.value, 0), ab = [...a.asset_allocation].sort((x, y) => y.value - x.value)[0];
  if (ab && at) I.assets = insight(`${clean(ab.name)}: ${Math.round((ab.value * 100) / at)}%`);
  if (a.budget && a.budget.items && a.budget.items.length) { const over = a.budget.items.filter((i) => i.status === "over").length, warn = a.budget.items.filter((i) => i.status === "warn").length;
    I.budget = over ? insight(`${over} excedido${over > 1 ? "s" : ""}`, "bad") : warn ? insight(`${warn} cerca del límite`, "warn") : insight("Todo dentro del límite", "ok"); }
  const g = (a.goals || []).filter((x) => !x.done).sort((x, y) => y.pct - x.pct)[0];
  if (g) I.goals = insight(`Más cerca: ${clean(g.name)} ${Math.round(g.pct)}%`);
  const pt = a.portfolio && a.portfolio.totals;
  if (pt && pt.unrealized_pct != null) I.pf = insight(`${pt.unrealized_pct > 0 ? "+" : ""}${pt.unrealized_pct}% de ganancia`, pt.unrealized_pct >= 0 ? "ok" : "bad");
  const p12 = a.projection && (a.projection.points || []).find((x) => x.months_ahead === 12);
  if (p12) I.proj = insight(`En 1 año: ${short(p12.projected)}`);
  const rc = (a.recurring || []).reduce((s, r) => s + (r.avg_amount || 0), 0);
  if (rc) I.rec = insight(`≈ ${short(rc)} al mes`);
  const wd = [...a.weekday].sort((x, y) => y.total - x.total)[0];
  if (wd && wd.total) I.dow = insight(`Gastas más en ${wd.day.toLowerCase()}`);
  const tm = a.this_month;
  if (tm.prev_avg) { const p = ((tm.projected - tm.prev_avg) * 100) / tm.prev_avg; I.month = insight(`${p >= 0 ? "+" : ""}${Math.round(p)}% vs. tu promedio`, p > 10 ? "bad" : p > 0 ? "warn" : "ok"); }
  const t5 = (a.top_expenses || []).reduce((s, t) => s + t.amount, 0);
  if (t5 && tm.spent) I.top = insight(`${Math.round((t5 * 100) / tm.spent)}% del gasto del mes`);
  return I;
}

    $("#gd").onclick = async () => { if (!(await confirmDialog("¿Eliminar meta?", "Se borran también sus aportaciones."))) return; try { await api("DELETE", "/api/goals/" + id); go("#/goals"); } catch (e) { toast(e.message, "error"); } };
    $$("[data-dc]", view).forEach((b) => b.onclick = async () => { try { await api("DELETE", "/api/goals/contribs/" + b.dataset.dc); route(); } catch (e) { toast(e.message, "error"); } });
  });
}

/* ---------------------------------------------------------------- Tablas personalizadas */
const COL_LABEL = { text: "Texto", number: "Número", money: "Dinero", date: "Fecha", check: "Casilla" };
function columnsEditor(cols = [{ name: "", type: "text" }], locked = new Set()) {
  return `<div id="cols">${cols.map((c, i) => `<div class="col-row" data-i="${i}" data-id="${esc(c.id || "")}"><input class="cn" maxlength="60" placeholder="Nombre de la columna" value="${esc(c.name)}" aria-label="Nombre de columna">
    <select class="ct" aria-label="Tipo">${Object.entries(COL_LABEL).map(([k, v]) => `<option value="${k}" ${c.type === k ? "selected" : ""}>${v}</option>`).join("")}</select><button type="button" class="icon-btn rm" aria-label="Quitar columna">${icon("x")}</button></div>`).join("")}</div>
    <button type="button" class="btn sm" id="col-add">${icon("plus")} Columna</button>`;
}
function bindColumnsEditor(el) {
  const host = $("#cols", el);
  const bindRm = () => $$(".rm", host).forEach((b) => b.onclick = () => { if ($$(".col-row", host).length > 1) b.closest(".col-row").remove(); });
  bindRm();
  $("#col-add", el).onclick = () => { const d = document.createElement("div"); d.className = "col-row"; d.dataset.id = ""; d.innerHTML = `<input class="cn" maxlength="60" placeholder="Nombre de la columna" aria-label="Nombre de columna"><select class="ct" aria-label="Tipo">${Object.entries(COL_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><button type="button" class="icon-btn rm" aria-label="Quitar columna">${icon("x")}</button>`; host.appendChild(d); bindRm(); $(".cn", d).focus(); };
  return () => $$(".col-row", host).map((r) => ({ ...(r.dataset.id ? { id: r.dataset.id } : {}), name: $(".cn", r).value, type: $(".ct", r).value }));
}
function tablesView(id) {
  if (id) return tableDetailView(id);
  const view = mountShell("tables", "Tablas", `<button class="btn primary" id="t-new">${icon("plus")} Tabla</button>`);
  const create = () => { let read; const m = modalForm("Nueva tabla", "t-f", `${field("Nombre", "name", 'maxlength="80" required placeholder="Suscripciones, Inventario, Pendientes…"')}<div class="lbl" style="margin-bottom:.4rem">Columnas</div>${columnsEditor([{ name: "", type: "text" }, { name: "", type: "money" }])}`, "Crear tabla",
    async (d, mm) => { const r = await api("POST", "/api/tables", { name: d.name, columns: read() }); mm.close(); go("#/tables/" + r.table.id); }, { onMount: (el) => { read = bindColumnsEditor(el); } }); return m; };
  $("#t-new").onclick = create;
  withRetry(view, async () => {
    const r = await api("GET", "/api/tables");
    if (!r.tables.length) { view.innerHTML = emptyCard("Sin tablas", "Crea tablas a tu medida (texto, números, dinero, fechas y casillas) con totales automáticos. Ideal para listas de suscripciones, pendientes o inventarios.", "t-e", "Crear tabla"); $("#t-e").onclick = create; return; }
    view.innerHTML = `<div class="grid acc-grid">${r.tables.map((t) => `<article class="card acc" tabindex="0" role="link" data-tb="${t.id}"><h3>${esc(t.name)}</h3><div class="muted small">${t.columns} columnas · ${t.rows} filas</div></article>`).join("")}</div>`;
    $$("[data-tb]", view).forEach((el) => { const open = () => go("#/tables/" + el.dataset.tb); el.onclick = open; el.onkeydown = (e) => { if (e.key === "Enter") open(); }; });
  });
}
function tableDetailView(id) {
  const view = mountShell("tables", "Tabla");
  withRetry(view, async () => {
    let t = (await api("GET", "/api/tables/" + id)).table;
    $(".topbar h1").innerHTML = `<button class="icon-btn" id="back" aria-label="Volver">${icon("back")}</button> ${esc(t.name)}`;
    $("#back").onclick = () => go("#/tables");
    const cellHtml = (c, v, rid) => c.type === "check" ? `<input type="checkbox" data-r="${rid}" data-c="${c.id}" ${v ? "checked" : ""} aria-label="${esc(c.name)}">`
      : `<input data-r="${rid}" data-c="${c.id}" type="${c.type === "date" ? "date" : "text"}" ${c.type === "number" || c.type === "money" ? 'inputmode="decimal" class="num"' : ""} value="${esc(v ?? "")}" aria-label="${esc(c.name)}">`;
    const totalCell = (c) => (c.type === "money" ? money(Math.round(parseFloat(t.totals[c.id] || 0) * 100), cur()) : c.type === "number" ? t.totals[c.id] : c.type === "check" ? `${t.totals[c.id]} ✓` : "");
    const draw = () => {
      view.innerHTML = `<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem"><button class="btn primary sm" id="ar">${icon("plus")} Fila</button><button class="btn sm" id="ec">Columnas y nombre</button><button class="btn sm" id="ex">${icon("download")} CSV</button><button class="btn sm danger" id="dt">${icon("trash")} Eliminar tabla</button></div>
        <div class="tbl-wrap card" style="padding:0"><table class="sheet"><thead><tr>${t.columns.map((c) => `<th>${esc(c.name)} <span class="muted small">${COL_LABEL[c.type]}</span></th>`).join("")}<th></th></tr></thead>
        <tbody>${t.rows.map((r) => `<tr>${t.columns.map((c) => `<td>${cellHtml(c, r.data[c.id], r.id)}</td>`).join("")}<td><button class="icon-btn" data-dr="${r.id}" aria-label="Eliminar fila">${icon("trash")}</button></td></tr>`).join("") || `<tr><td colspan="${t.columns.length + 1}" class="empty">Sin filas. Usa “Fila” para agregar.</td></tr>`}</tbody>
        <tfoot><tr>${t.columns.map((c) => `<td class="tot" data-tot="${c.id}">${esc(totalCell(c))}</td>`).join("")}<td></td></tr></tfoot></table></div>`;
      $("#ar", view).onclick = async () => { try { t = (await api("POST", `/api/tables/${id}/rows`, { data: {} })).table; draw(); const last = $$("tbody tr:last-child input", view)[0]; if (last) last.focus(); } catch (e) { toast(e.message, "error"); } };
      $("#ex", view).onclick = () => downloadFile(`/api/tables/${id}.csv`);

      $$("[data-dr]", view).forEach((b) => b.onclick = async () => { try { t = (await api("DELETE", `/api/tables/${id}/rows/${b.dataset.dr}`)).table; draw(); } catch (e) { toast(e.message, "error"); } });
      $$("tbody input", view).forEach((inp) => inp.onchange = async () => {

        try { t = (await api("PUT", `/api/tables/${id}/rows/${inp.dataset.r}`, { data: { [inp.dataset.c]: val } })).table; inp.classList.remove("bad");
          if (col.type === "money") { const row = t.rows.find((r) => r.id === +inp.dataset.r); inp.value = row.data[col.id] ?? ""; }
          $$("[data-tot]", view).forEach((td) => { const c = t.columns.find((x) => x.id === td.dataset.tot); td.textContent = totalCell(c); }); }
        catch (e) { inp.classList.add("bad"); toast(e.message, "error"); }
      });
      $("#ec", view).onclick = () => { let read; modalForm("Nombre y columnas", "ec-f", `${field("Nombre de la tabla", "name", 'maxlength="80" required', t.name)}<div class="lbl" style="margin-bottom:.4rem">Columnas</div>${columnsEditor(t.columns)}<p class="muted small">Una columna con datos no puede cambiar de tipo; crea una nueva. Al quitar una columna se borran sus datos.</p>`, "Guardar",
        async (d, mm) => { t = (await api("PATCH", "/api/tables/" + id, { name: d.name, columns: read() })).table; mm.close(); $(".topbar h1").innerHTML = `<button class="icon-btn" id="back" aria-label="Volver">${icon("back")}</button> ${esc(t.name)}`; $("#back").onclick = () => go("#/tables"); draw(); toast("Tabla actualizada."); }, { onMount: (el) => { read = bindColumnsEditor(el); } }); };
    };
    draw();
  });
}

/* ---------------------------------------------------------------- Comprobantes */
async function scanReceipt(file) {
  const fd = new FormData(); fd.append("file", file);
  return uploadForm("/api/receipts", fd);
}
/* Confirmar la lectura del comprobante y guardar el movimiento con lo mínimo: tipo, importe, fecha, cuenta y comercio. */
function receiptConfirmModal(rid, sug, onSaved) {
  const active = S.accounts.filter((a) => !a.archived);
  if (!active.length) { toast("Primero crea una cuenta para registrar movimientos.", "error"); return go("#/accounts"); }
  const lastAcc = store.get("lastAccount", active[0].id);
  const st = { type: "expense" };
  const m = openModal("Confirmar comprobante", "");
  const draw = (keep) => {
    const v = { ...keep };
    const accOpt = active.map((a) => `<option value="${a.id}" ${String(v.account_id ?? lastAcc) === String(a.id) ? "selected" : ""}>${esc(a.name)} (${a.currency})</option>`).join("");
    const cats = categoryOptions(st.type);
    m.el.querySelector(".modal").innerHTML = `<header><h2>Confirmar comprobante</h2><button class="icon-btn" data-close aria-label="Cerrar">${icon("x")}</button></header>
      <form id="rc-conf-f" novalidate><p class="muted small">Revisa lo que leyó FIPO y corrige lo que haga falta antes de guardar.</p>
        <div class="seg" role="tablist" aria-label="Tipo de movimiento">${["expense", "income"].map((k) => `<button type="button" role="tab" data-t="${k}" class="${st.type === k ? "on" : ""}" aria-selected="${st.type === k}">${TYPE_LABEL[k]}</button>`).join("")}</div>
        <div class="row2">${field("Importe", "amount", 'inputmode="decimal" placeholder="0.00" autocomplete="off" required', v.amount ?? (sug && sug.amount ? centsToInput(sug.amount) : ""))}
          ${field("Fecha", "date", 'type="date" required', v.date ?? (sug && sug.date ? sug.date : todayStr()))}</div>
        <div class="field"><label for="f-account_id">Cuenta</label><select id="f-account_id" name="account_id">${accOpt}</select></div>
        <div class="field"><label for="f-category_id">Categoría</label><select id="f-category_id" name="category_id"><option value="">Sin categoría</option>${cats.map(([id, n]) => `<option value="${id}" ${String(v.category_id ?? "") === String(id) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
        ${field("Comercio o descripción", "description", 'maxlength="200"', v.description ?? (sug ? sug.merchant || "" : ""))}
        <p class="muted small"><a href="#" id="rc-more">¿Necesitas más campos (método de pago, notas, transferencia)? Ábrelo completo</a></p>
        <footer><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Confirmar y guardar</button></footer></form>`;
    const form = $("#rc-conf-f", m.el);
    $$(".seg button", form).forEach((b) => b.onclick = () => { const d = formData(form); delete d.category_id; st.type = b.dataset.t; draw(d); });
    $("#rc-more", form).onclick = (e) => { e.preventDefault(); const d = formData(form); m.close(); txModal(null, { type: st.type, amount: d.amount, date: d.date, account_id: d.account_id, category_id: d.category_id, description: d.description, receipt_id: rid }); };
    form.onsubmit = (e) => { e.preventDefault(); submitForm(form, async () => {
      const d = formData(form);
      const saved = await api("POST", "/api/transactions", { type: st.type, amount: d.amount, date: d.date, account_id: d.account_id, category_id: d.category_id || null, description: d.description });
      try { await api("POST", `/api/receipts/${rid}/link`, { tx_id: saved.transaction.id }); } catch { /* el movimiento ya se guardó */ }
      store.set("lastAccount", d.account_id); m.close(); await refreshCore(); toast("Movimiento guardado a partir del comprobante."); if (onSaved) onSaved(); else route(); }); };
  };
  draw();
}
function receiptsView() {
  const view = mountShell("receipts", "Comprobantes");
  let filter = "unlinked";
  const draw = async () => {
    const r = await api("GET", "/api/receipts" + (filter === "unlinked" ? "?unlinked=1" : ""));
    $("#rc-list", view).innerHTML = r.receipts.length ? `<div class="grid acc-grid">${r.receipts.map((x) => `<article class="card"><a href="/api/receipts/${x.id}/file" target="_blank" rel="noopener"><img class="rc-img" src="/api/receipts/${x.id}/file" alt="Comprobante ${esc(x.filename)}" loading="lazy"></a>
      <div class="muted small" style="margin:.4rem 0">${esc(x.filename)} · ${x.tx_id ? "ligado a un movimiento" : "sin ligar"}</div><div style="display:flex;gap:.4rem;flex-wrap:wrap">${x.tx_id ? "" : `<button class="btn primary sm" data-use="${x.id}">Revisar y confirmar</button>`}<button class="btn sm danger" data-del="${x.id}" aria-label="Eliminar">${icon("trash")}</button></div></article>`).join("")}</div>` : '<div class="empty">No hay comprobantes en esta lista.</div>';
    $$("[data-use]", view).forEach((b) => b.onclick = async () => { try { const d = await api("GET", "/api/receipts/" + b.dataset.use); receiptConfirmModal(+b.dataset.use, d.suggestion, draw); } catch (e) { toast(e.message, "error"); } });
    $$("[data-del]", view).forEach((b) => b.onclick = async () => { if (!(await confirmDialog("¿Eliminar comprobante?", "Se borra la imagen guardada."))) return; try { await api("DELETE", "/api/receipts/" + b.dataset.del); draw(); } catch (e) { toast(e.message, "error"); } });
  };
  view.innerHTML = `<section class="card" style="margin-bottom:1rem;max-width:640px"><h2>Escanear un comprobante</h2><p class="muted small">Toma una foto de tu ticket. Revisa el importe antes de guardar.</p>
    <div class="field"><label for="rc-file">Foto del comprobante</label><input id="rc-file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></div><div id="rc-out"></div></section>
    <div class="tabs" role="tablist"><button class="on" data-f="unlinked">Sin ligar</button><button data-f="all">Todos</button></div><div id="rc-list"><div class="spinner"></div></div>`;
  $$(".tabs button", view).forEach((b) => b.onclick = () => { filter = b.dataset.f; $$(".tabs button", view).forEach((x) => x.classList.toggle("on", x === b)); draw(); });
  $("#rc-file", view).onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return; const out = $("#rc-out", view); out.innerHTML = '<div class="spinner"></div><p class="muted small" style="text-align:center">Leyendo comprobante…</p>';
    try {
      const r = await scanReceipt(f), s = r.suggestion;
      out.innerHTML = `<div class="note">${r.ocr_available ? (s && (s.amount || s.date || s.merchant) ? `Leí: <b>${esc(s.merchant || "comercio no detectado")}</b> · total <b>${s && s.amount ? esc(money(s.amount, cur(), { mask: false })) : "no detectado"}</b> · fecha <b>${s && s.date ? esc(fmtDate(s.date)) : "no detectada"}</b>.` : "No pude detectar datos en la imagen. Prueba con una foto más clara o captura el movimiento a mano.") : esc(r.ocr_error || "La lectura automática no está disponible en este servidor.") + " El comprobante quedó guardado."}</div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn primary" id="rc-use">Revisar y confirmar</button><button class="btn" id="rc-keep">Solo guardar</button></div>${r.text ? `<details style="margin-top:.6rem"><summary class="muted small" style="cursor:pointer">Ver texto leído</summary><pre class="ocr">${esc(r.text)}</pre></details>` : ""}`;
      $("#rc-use", view).onclick = () => receiptConfirmModal(r.receipt.id, s, () => { out.innerHTML = ""; e.target.value = ""; draw(); }); $("#rc-keep", view).onclick = () => { out.innerHTML = ""; e.target.value = ""; draw(); toast("Comprobante guardado."); };
      draw();
    } catch (er) { out.innerHTML = ""; toast(er.message, "error"); }
  };
  draw().catch((e) => { $("#rc-list", view).innerHTML = errorBox(e); });
}

</script>
<script>
/* Avisos dentro de FIPO: campana, centro de notificaciones y precios objetivo. */
ICONS.bell = "M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0";

let notifTimer = null;
const NOTIF_EVERY = 60000;
const notifBellHtml = () => `<button class="icon-btn bell" id="bell" title="Avisos" aria-label="Avisos">${icon("bell")}<span class="badge-n" id="bell-n" hidden>0</span></button>`;

function setBell(n) {
  const b = $("#bell-n"); if (!b) return;
  b.textContent = n > 99 ? "99+" : n; b.hidden = !n;
  const bell = $("#bell"); if (bell) bell.setAttribute("aria-label", n ? `Avisos (${n} sin leer)` : "Avisos");
}

async function pollNotifications(first = false) {
  if (!S.user) return;
  let r;
  try { r = await api("GET", "/api/notifications"); } catch { return; }
  S.notif = r; setBell(r.unread);
  const last = store.get("notif.toasted." + S.user.id, 0);
  const fresh = r.items.filter((i) => !i.read_at && i.id > last).reverse();
  fresh.slice(-3).forEach((i) => toast(i.title + " · " + i.body, i.kind === "price_low" ? "error" : "ok"));
  if (fresh.length) {
    store.set("notif.toasted." + S.user.id, Math.max(...fresh.map((i) => i.id)));
    if (window.Notification && Notification.permission === "granted" && !PUSH.active) {   // con push activo ya llega por el teléfono
      fresh.slice(-3).forEach((i) => { try { new Notification(i.title, { body: i.body }); } catch { /* */ } });
    }
  }
  if ($("#notif-list")) drawNotifList();
}

function startNotifications() {
  const bell = $("#bell"); if (!bell) return;
  bell.onclick = openNotifications;
  if (S.notif) setBell(S.notif.unread);
  clearInterval(notifTimer);
  notifTimer = setInterval(() => { if (!document.hidden) pollNotifications(); }, NOTIF_EVERY);
  pollNotifications(true);
  pushSync();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.user) pollNotifications(); });

const NOTIF_KIND = { card_due: "Tarjeta", recurring: "Cargo recurrente", price_high: "Precio objetivo", price_low: "Precio límite", watch_report: "Reporte" };

function drawNotifList() {
  const box = $("#notif-list"); if (!box) return;
  const items = (S.notif && S.notif.items) || [];
  box.innerHTML = items.length ? items.map((i) => `<div class="notif ${i.read_at ? "" : "unread"}" data-id="${i.id}">
      <button class="notif-main" data-open="${i.id}"><span class="badge">${esc(NOTIF_KIND[i.kind] || "Aviso")}</span>
        <b>${esc(i.title)}</b><span class="muted small">${esc(i.body)}</span><span class="muted small">${esc(fmtStamp(i.created_at.replace(" ", "T") + "Z"))}</span></button>
      <button class="icon-btn" data-rm="${i.id}" aria-label="Quitar aviso">${icon("x")}</button></div>`).join("")
    : '<div class="empty"><p>No tienes avisos. Aquí verás los recordatorios de pago de tus tarjetas y cuando un activo llegue a tu precio objetivo.</p></div>';
  $$("[data-open]", box).forEach((b) => b.onclick = async () => {
    const it = items.find((x) => x.id === +b.dataset.open);
    try { if (!it.read_at) await api("POST", "/api/notifications/read", { ids: [it.id] }); } catch { /* */ }
    if (notifModal) notifModal.close();
    await pollNotifications(); if (it.link) go(it.link);
  });
  $$("[data-rm]", box).forEach((b) => b.onclick = async () => { try { await api("DELETE", "/api/notifications/" + b.dataset.rm); await pollNotifications(); } catch (e) { toast(e.message, "error"); } });
}

let notifModal = null;
/* ---------- avisos push: llegan al teléfono aunque FIPO esté cerrada ---------- */
const PUSH = { ok: "serviceWorker" in navigator && "PushManager" in window && "Notification" in window, info: null, active: false, synced: false };
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const b64ToBytes = (b) => { const s = atob((b + "=".repeat((4 - (b.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, (c) => c.charCodeAt(0)); };
async function pushReg() { return navigator.serviceWorker.getRegistration("/").then((r) => r || navigator.serviceWorker.register("/sw.js", { scope: "/" })); }
async function pushSub() { if (!PUSH.ok) return null; try { const r = await pushReg(); return r ? await r.pushManager.getSubscription() : null; } catch { return null; } }
const deviceName = () => (isIOS() ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "Computadora") + (isStandalone() ? " (app)" : "");
/* al abrir FIPO: si este dispositivo ya tenía avisos, se le recuerda al servidor (por si cambió la suscripción) */
async function pushSync() {
  if (PUSH.synced || window.FIPO_PREVIEW || !PUSH.ok || !S.user) return; PUSH.synced = true;
  try { const sub = await pushSub(); PUSH.active = !!sub && Notification.permission === "granted";
    if (PUSH.active) await api("POST", "/api/push/subscribe", { ...sub.toJSON(), device: deviceName() }); } catch { /* sin conexión: se reintenta al volver a abrir */ }
}
async function drawPushBox(box) {
  if (!box) return;
  const say = (html) => { box.innerHTML = html; };
  if (window.FIPO_PREVIEW) return say('<p class="muted small">En la app instalada (con servidor) puedes activar aquí los avisos en tu teléfono, que llegan aunque FIPO esté cerrada. En esta vista previa no hay servidor que los envíe.</p>');
  if (isIOS() && !isStandalone()) return say('<p class="small"><b>Para recibir avisos con FIPO cerrada:</b> agrega FIPO a tu pantalla de inicio (en Safari: Compartir → «Agregar a inicio») y ábrela desde ese ícono. Ahí aparecerá el botón para activarlos. Necesitas iOS 16.4 o más nuevo.</p>');
  if (!PUSH.ok) return say('<p class="muted small">Este navegador no permite avisos push. En iPhone funcionan con FIPO agregada a la pantalla de inicio (iOS 16.4 o más nuevo).</p>');
  if (Notification.permission === "denied") return say(`<p class="small">Los avisos de FIPO están bloqueados en este dispositivo. Para activarlos: <b>${isIOS() ? "Ajustes del iPhone → Notificaciones → FIPO → Permitir notificaciones" : "permite las notificaciones de este sitio en la configuración del navegador"}</b>, y vuelve aquí.</p>`);
  let info; try { info = PUSH.info = await api("GET", "/api/push"); } catch (e) { return say(`<p class="muted small">${esc(e.message)}</p>`); }
  const sub = await pushSub(); PUSH.active = !!sub && Notification.permission === "granted";
  const last = info.cron.last_run, fresh = last && (Date.now() - new Date(last.replace(" ", "T") + "Z").getTime()) < 3 * 3600e3;
  const cronHtml = fresh ? `<p class="muted small" style="margin:.5rem 0 0">Revisión automática funcionando · última: ${esc(fmtStamp(last.replace(" ", "T") + "Z"))}</p>`
    : `<details class="push-cron" ${PUSH.active ? "open" : ""}><summary class="small"><b>Falta un paso único</b> para que los avisos lleguen con FIPO cerrada</summary>

      <ol class="small"><li>Entra a <b>cron-job.org</b> y crea una cuenta gratis.</li><li>«Create cronjob» → en <b>URL</b> pega esta dirección:</li></ol>

    ? `<p class="small" style="margin:0 0 .6rem"><b>Avisos activados en este dispositivo.</b> Te llegan aunque FIPO esté cerrada.</p>

function targetCard(sym, p, al) {

}

function bindTargets(sym, p, al) {
  const reload = () => route();
  $("#t-edit").onclick = () => {
    const m = openModal("Precios objetivo · " + sym, `<form id="t-f" novalidate><p class="muted small">Precio actual: <b>${p.price != null ? esc(money(Math.round(p.price * 100), p.currency)) : "sin precio"}</b>. Deja vacío el límite que no quieras usar.</p>
      ${field("Límite inferior (" + p.currency + ")", "lower", 'inputmode="decimal"', al && al.lower != null ? al.lower : "")}
      ${field("Objetivo superior (" + p.currency + ")", "upper", 'inputmode="decimal"', al && al.upper != null ? al.upper : "")}
      <footer><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar</button></footer></form>`, {
      onMount: (el) => { $("#t-f", el).onsubmit = (e) => { e.preventDefault(); submitForm(e.target, async () => {
        const d = formData(e.target); await api("PUT", "/api/price-alerts", { symbol: sym, lower: d.lower, upper: d.upper, active: al ? al.active : true });
        m.close(); toast("Objetivos guardados."); await pollNotifications(); reload(); }); }; } });
  };
  const tg = $("#t-toggle"); if (tg) tg.onclick = async () => { try { await api("PUT", "/api/price-alerts", { symbol: sym, lower: al.lower, upper: al.upper, active: !al.active }); reload(); } catch (e) { toast(e.message, "error"); } };
  const td = $("#t-del"); if (td) td.onclick = async () => { try { await api("DELETE", "/api/price-alerts/" + encodeURIComponent(sym)); toast("Objetivos quitados."); reload(); } catch (e) { toast(e.message, "error"); } };
}

const wgHex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

function wgStyle(palKey, custom, mode) {

const wgPct = (p) => (p == null ? "—" : (p > 0 ? "+" : "") + p.toFixed(2) + "%");
const wgM = (c, o) => money(c, WG.data ? WG.data.currency : cur(), o);
function wgSpark(vals, h = 56) {
  if (!vals || vals.length < 2) return "";
  const w = 200, pad = 4, mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
  const p = vals.map((v, i) => [pad + ((w - 2 * pad) * i) / (vals.length - 1), pad + (h - 2 * pad) * (1 - (v - mn) / sp)]);
  let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;

  return `<svg class="wg-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="wg-area" d="${d} L${w - pad} ${h} L${pad} ${h} Z"/><path class="wg-line" d="${d}"/></svg>`;
}
function wgRing(score10, label = "de 10") {
  const R = 50, C = 2 * Math.PI * R, v = score10 == null ? 0 : Math.max(0, Math.min(10, score10)) / 10, len = v * C;

const WG_SHADES = [1, 0.7, 0.46, 0.26];

  if (WG.edit && !MOBILE.matches) {
    let from = null;
    grid.addEventListener("dragstart", (e) => { const c = e.target.closest(".wg"); if (!c) return; from = c.dataset.wid; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", from); } catch { /* */ } });
    grid.addEventListener("dragend", () => { from = null; $$(".wg", grid).forEach((c) => c.classList.remove("dragging", "over")); });

  }
}
function wgMove(id, beforeId) {                  // id pasa a ocupar el lugar de beforeId (entre los visibles)
  const items = WG.layout.items, i = items.findIndex((x) => x.id === id), [it] = items.splice(i, 1), j = items.findIndex((x) => x.id === beforeId);
  items.splice(i < j + 1 && i <= j ? j + 1 : j, 0, it);
}
function wgShift(id, dir) {                      // mover antes / después entre los visibles (útil en pantalla táctil)
  const items = WG.layout.items, vis = items.filter((x) => x.visible), k = vis.findIndex((x) => x.id === id), t = vis[k + dir]; if (!t) return false;
  const a = items.findIndex((x) => x.id === id), b = items.findIndex((x) => x.id === t.id); [items[a], items[b]] = [items[b], items[a]]; return true;
}

/* menú ••• (flota fuera de la tarjeta para no recortarse) */
let wgPop = null;
function wgMenuClose() { if (wgPop) { wgPop.remove(); wgPop = null; document.removeEventListener("pointerdown", wgOutside, true); document.removeEventListener("keydown", wgEsc); } }
const wgOutside = (e) => { if (wgPop && !wgPop.contains(e.target) && !e.target.closest("[data-wmenu]")) wgMenuClose(); };
const wgEsc = (e) => { if (e.key === "Escape") wgMenuClose(); };
function wgMenu(btn, view) {
  const had = wgPop && wgPop.dataset.for === btn.dataset.wmenu; wgMenuClose(); if (had) return;
  const id = btn.dataset.wmenu, def = WG_DEFS[id], it = wgItem(id), vis = WG.layout.items.filter((x) => x.visible), k = vis.findIndex((x) => x.id === id);
  const redraw = () => { wgMenuClose(); wgSave(); wgDraw(view); };
  const pop = document.createElement("div"); pop.className = "wg-pop"; pop.dataset.for = id; pop.setAttribute("role", "menu");
  pop.innerHTML = `<button role="menuitem" data-m="edit">${icon("edit")} Editar</button><button role="menuitem" data-m="color">${icon("leaf")} Cambiar color</button>
    ${def.sizes.length > 1 ? `<div class="wg-pop-sz" role="group" aria-label="Cambiar tamaño"><span>Tamaño</span>${def.sizes.map((s) => `<button data-sz="${s}" class="${it.size === s ? "on" : ""}">${WG_SIZE_LABEL[s].slice(0, 1)}<small>${WG_SIZE_LABEL[s]}</small></button>`).join("")}</div>` : ""}
    <div class="wg-pop-mv"><button data-m="prev" ${k <= 0 ? "disabled" : ""}>${icon("chevron")} Antes</button><button data-m="next" ${k >= vis.length - 1 ? "disabled" : ""}>Después ${icon("chevron", "rot180")}</button></div>
    <button role="menuitem" data-m="hide">${icon("eyeoff")} Ocultar</button>`;
  document.body.appendChild(pop); wgPop = pop;
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.right - pw)) + "px";
  pop.style.top = (r.bottom + ph + 12 > window.innerHeight ? Math.max(8, r.top - ph - 6) : r.bottom + 6) + "px";
  pop.onclick = (e) => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.sz) { it.size = b.dataset.sz; return redraw(); }
    const m = b.dataset.m;
    if (m === "hide") { it.visible = false; toast(`«${def.title}» oculto. Puedes volver a agregarlo desde el catálogo.`); return redraw(); }
    if (m === "prev" || m === "next") { wgShift(id, m === "prev" ? -1 : 1); return redraw(); }
    wgMenuClose(); wgConfig(id, { focus: m === "color" ? "color" : "", done: () => { wgSave(); wgDraw(view); } });
  };
  document.addEventListener("pointerdown", wgOutside, true); document.addEventListener("keydown", wgEsc);
  const f = $("button", pop); if (f) f.focus();
}

async function wgShowToken(token, after) {

    <ol class="wg-ul ol"><li>Instala <b>Scriptable</b> desde la App Store (gratis).</li><li>Toca <b>Copiar script</b>, abre Scriptable, crea un script nuevo (+) y pégalo. Guárdalo con el nombre “FIPO”. <b>Si ya tenías uno, borra todo su contenido y pega este</b>: es la última vez, porque este script baja solo el diseño más reciente.</li>
    <li>En la pantalla de inicio: mantén presionado → <b>+</b> → Scriptable → elige tamaño → toca el widget → <b>Script: FIPO</b>. En “Parameter” escribe <code>summary</code>, <code>portfolio</code>, <code>health</code>, <code>budget</code>, <code>goal</code>, <code>goals</code>, <code>categories</code>, <code>recent</code> o <code>quick</code> (nuevo movimiento). Se ven con los mismos colores que elijas aquí.</li></ol>
    <div class="field"><label for="wg-url">Enlace privado</label><input id="wg-url" readonly value="${esc(url)}"></div>
    <div class="wg-ios-a"><button class="btn primary" id="wg-copy-script" ${script ? "" : "disabled"}>Copiar script</button><button class="btn" id="wg-copy-url">Copiar solo el enlace</button></div>
    <p class="muted small">El widget se actualiza cuando iOS lo decide (normalmente cada 15–60 min). Si tu FIPO está en PythonAnywhere gratis, cada consulta usa un poco de tus 100 s de CPU al día: es poco, pero por eso no se actualiza más seguido.</p>
    <footer><button class="btn primary" data-close>Listo</button></footer>`, { wide: true });
  const copy = async (txt, ok) => { try { await navigator.clipboard.writeText(txt); toast(ok); } catch { const el = $("#wg-url", m.el); el.value = txt; el.select(); toast("Selecciona y copia el texto.", "error"); } };
  $("#wg-copy-script", m.el).onclick = () => copy(script, "Script copiado.");

<script>
/* Vista previa web: reemplaza el servidor Flask por una versión en el navegador.

"use strict";
(function () {

  const CURRENCIES = ["MXN", "USD", "EUR", "GBP", "CAD", "COP", "ARS", "CLP", "PEN", "BRL"];
  // Tipos de cambio de ejemplo (unidades por 1 USD) SOLO para la vista previa: aquí no hay conexión con Yahoo
  // Finance, así que no puede traer el tipo de cambio real. Sirven para mostrar cómo se vería el botón
  // «ver en <moneda principal>»; en la app con servidor el tipo de cambio se consulta de verdad y se actualiza.

  function fxRate(from, to) {
    from = (from || "").toUpperCase(); to = (to || "").toUpperCase();
    if (!from || !to || from === to) return 1;
    const rf = FX_USD[from], rt = FX_USD[to];
    if (!rf || !rt) return null;
    return rt / rf;
  }
  const ACC_TYPES = ["bank", "cash", "savings", "digital", "credit", "investment", "other"];
  const TX_TYPES = ["expense", "income", "transfer", "refund", "adjustment"];
  const EXP_CATS = ["Comida", "Transporte", "Vivienda", "Entretenimiento", "Salud", "Educación", "Viajes", "Servicios", "Suscripciones", "Compras", "Inversiones"];
  const INC_CATS = ["Nómina", "Ventas", "Negocio", "Rendimientos", "Reembolsos", "Otros ingresos"];
  let TZS = ["America/Mexico_City", "America/Merida", "America/Bogota", "America/Lima", "America/Santiago", "America/Argentina/Buenos_Aires", "America/New_York", "America/Los_Angeles", "Europe/Madrid", "UTC"];
  try { const l = Intl.supportedValuesOf("timeZone"); if (l && l.length) TZS = l; } catch { /* lista corta */ }

  /* ---------- persistencia ---------- */
  let mem = null;
  const fresh = () => ({ users: [], accounts: [], categories: [], transactions: [], ops: [], quotes: {}, imports: [], debts: [], debtPays: [], budgets: [], goals: [], contribs: [], tables: [], plans: [], planCharges: [], recurring: [], seq: { u: 0, a: 0, c: 0, t: 0, o: 0, i: 0, d: 0, dp: 0, g: 0, gc: 0, tb: 0, tr: 0, pl: 0, rc: 0 }, session: null });
  function db() {
    if (mem) return mem;
    try { const r = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY); if (r) mem = JSON.parse(r); } catch { /* vacío */ }
    mem = mem || fresh();
    mem.ops = mem.ops || []; mem.quotes = mem.quotes || {}; mem.imports = mem.imports || []; mem.seq.o = mem.seq.o || 0; mem.seq.i = mem.seq.i || 0;
    for (const k of ["debts", "debtPays", "budgets", "goals", "contribs", "tables", "plans", "planCharges", "recurring"]) mem[k] = mem[k] || []; for (const k of ["d", "dp", "g", "gc", "tb", "tr", "pl", "rc"]) mem.seq[k] = mem.seq[k] || 0;
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch { /* sin almacenamiento: sigue en memoria */ } }
  function resetAll() { mem = fresh(); save(); }
  const nid = (k) => (db().seq[k] += 1);

  /* ---------- utilidades ---------- */
  const fail = (msg, status = 400, field = null) => { throw new ApiError(msg, status, field); };
  const MAX = 1e13;
  function toCents(v, field = "importe", { neg = false, zero = false } = {}) {
    if (v === null || v === undefined || (typeof v === "string" && !v.trim())) fail("Introduce un importe.", 400, field);
    let s = String(v).replace(/[,$\s]/g, "");
    const m = /^([+-]?)(\d*)(?:\.(\d*))?$/.exec(s);
    if (!m || (m[2] === "" && (m[3] === undefined || m[3] === ""))) fail("El importe no es un número válido.", 400, field);
    const frac = ((m[3] || "") + "000").slice(0, 3);
    let cents = (parseInt(m[2] || "0", 10)) * 100 + parseInt(frac.slice(0, 2), 10) + (parseInt(frac[2], 10) >= 5 ? 1 : 0);
    if (m[1] === "-") cents = -cents;
    if (Math.abs(cents) > MAX) fail("El importe es demasiado grande.", 400, field);
    if (cents < 0 && !neg) fail("El importe no puede ser negativo.", 400, field);
    if (cents === 0 && !zero) fail("El importe debe ser mayor que cero.", 400, field);
    return cents;
  }
  function parseDate(v, field = "fecha") {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));
    if (!m) fail("La fecha no es válida (AAAA-MM-DD).", 400, field);
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    if (d.getUTCFullYear() !== +m[1] || d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) fail("La fecha no es válida (AAAA-MM-DD).", 400, field);
    if (+m[1] < 1990 || +m[1] > 2100) fail("La fecha está fuera de rango.", 400, field);
    return String(v);
  }
  const U = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const fromU = (t) => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
  const addDays = (s, n) => fromU(U(s) + n * 86400000);
  const dowMon0 = (s) => (new Date(U(s)).getUTCDay() + 6) % 7;
  const monthStart = (s) => s.slice(0, 8) + "01";
  const monthEnd = (y, m) => fromU(Date.UTC(y, m, 0));           // m = 1..12
  const todayFor = (tz) => { try { return new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(new Date()); } catch { return ymd(new Date()); } };
  function text(v, field, max, required = false) {
    const s = v == null ? "" : String(v).trim();
    if (required && !s) fail("Este campo es obligatorio.", 400, field);
    if (s.length > max) fail(`Máximo ${max} caracteres.`, 400, field);
    return s;
  }
  async function hashPw(pw, salt) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch { let h = 5381; const s = salt + ":" + pw; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "x" + (h >>> 0).toString(16); }
  }
  const rid = () => Math.random().toString(36).slice(2, 12);
  const userDict = (u) => ({ id: u.id, name: u.name, email: u.email, currency: u.currency, timezone: u.timezone, theme: u.theme, onboarded: !!u.onboarded, notify_email: false });
  const me = () => { const d = db(); return d.users.find((u) => u.id === d.session) || null; };
  function need() { const u = me(); if (!u) throw new ApiError("Inicia sesión para continuar.", 401); return u; }

  /* ---------- saldos ---------- */
  function effect(t, accId) {
    let e = 0;
    if (t.account_id === accId) {
      if (t.type === "income" || t.type === "refund" || t.type === "adjustment") e += t.amount;
      else if (t.type === "expense" || t.type === "transfer") e -= t.amount;
    }

    return e;
  }
  const opCash = (o) => (o.kind === "buy" ? -(o.gross + o.fee) : o.gross - o.fee);
  const balanceOf = (uid, a) => a.opening_balance + db().transactions.filter((t) => t.user_id === uid && (t.account_id === a.id || t.to_account_id === a.id)).reduce((s, t) => s + effect(t, a.id), 0)
    + db().ops.filter((o) => o.user_id === uid && o.account_id === a.id).reduce((s, o) => s + opCash(o), 0)

      if (method === "GET") return { goal: goalRow(u, g), contribs: d.contribs.filter((c) => c.goal_id === g.id).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id)) };
      if (method === "PATCH") { const f = goalF(body, g); if (f.currency !== g.currency && d.contribs.some((c) => c.goal_id === g.id)) fail("No puedes cambiar la moneda de una meta con aportaciones.", 400, "currency"); Object.assign(g, f, { archived: (body.archived ?? g.archived) ? 1 : 0 }); return { goal: goalRow(u, g) }; }
      if (method === "DELETE") { d.goals = d.goals.filter((x) => x !== g); d.contribs = d.contribs.filter((c) => c.goal_id !== g.id); return { ok: true }; }
    }
    // ---- tablas
    if (path === "/api/tables" && method === "GET") return { tables: d.tables.filter((t) => t.user_id === u.id).sort(cmpName).map((t) => ({ id: t.id, name: t.name, columns: t.columns.length, rows: t.rows.length })) };
    if (path === "/api/tables" && method === "POST") { if (d.tables.filter((t) => t.user_id === u.id).length >= 50) fail("Máximo 50 tablas."); const t = { id: nid("tb"), user_id: u.id, name: text(body.name, "name", 80, true), columns: cleanCols(body.columns), rows: [] }; d.tables.push(t); return { table: tablePayload(t) }; }
    if ((m = /^\/api\/tables\/(\d+)\.csv$/.exec(path))) {
      const t = d.tables.find((x) => x.id === +m[1] && x.user_id === u.id); if (!t) fail("Tabla no encontrada.", 404);
      const lines = [t.columns.map((c) => csvSafe(c.name))].concat(t.rows.map((r) => t.columns.map((c) => (c.type === "check" ? (r.data[c.id] ? "Sí" : "") : csvSafe(r.data[c.id] ?? "")))));
      return { __file: true, name: "tabla.csv", data: "﻿" + lines.map((l) => l.map(csvCell).join(",")).join("\r\n") + "\r\n" };
    }
    if ((m = /^\/api\/tables\/(\d+)\/rows(?:\/(\d+))?$/.exec(path))) {
      const t = d.tables.find((x) => x.id === +m[1] && x.user_id === u.id); if (!t) fail(m[2] ? "Fila no encontrada." : "Tabla no encontrada.", 404);
      if (method === "POST" && !m[2]) { if (t.rows.length >= 5000) fail("Máximo 5,000 filas por tabla."); const r = { id: nid("tr"), data: cleanRow(t.columns, body.data || {}) }; t.rows.push(r); return { table: tablePayload(t), row_id: r.id }; }
      const r = t.rows.find((x) => x.id === +m[2]); if (!r) fail("Fila no encontrada.", 404);
      if (method === "PUT") { for (const c of t.columns) { if (c.id in (body.data || {})) { const v = cleanCell(body.data[c.id], c.type, c.name); if (v === null) delete r.data[c.id]; else r.data[c.id] = v; } } return { table: tablePayload(t) }; }
      if (method === "DELETE") { t.rows = t.rows.filter((x) => x !== r); return { table: tablePayload(t) }; }
    }
    if ((m = /^\/api\/tables\/(\d+)$/.exec(path))) {
      const t = d.tables.find((x) => x.id === +m[1] && x.user_id === u.id); if (!t) fail("Tabla no encontrada.", 404);
      if (method === "GET") return { table: tablePayload(t) };
      if (method === "PATCH") {
        let cols = t.columns;
        if (body.columns) { const used = new Set(); t.rows.forEach((r) => Object.entries(r.data).forEach(([k, v]) => { if (v !== "" && v !== false && v != null) used.add(k); })); cols = cleanCols(body.columns, t.columns, used);
          const gone = new Set(t.columns.map((c) => c.id).filter((id) => !cols.some((c) => c.id === id))); t.rows.forEach((r) => gone.forEach((g) => delete r.data[g])); }
        t.name = text(body.name ?? t.name, "name", 80, true); t.columns = cols; return { table: tablePayload(t) };
      }
      if (method === "DELETE") { d.tables = d.tables.filter((x) => x !== t); return { ok: true }; }
    }
    // ---- comprobantes (la lectura OCR necesita el servidor)
    if (path === "/api/receipts" && method === "GET") return { receipts: [], ocr_available: false };
    if (path === "/api/receipts" && method === "POST") fail("Los comprobantes con lectura automática (OCR) se guardan en el servidor; no están disponibles en esta vista previa.", 501);
    if (path === "/api/dashboard") { const r = dashboard(u, q), ps = portfolioSummary(u), pv = ps.totals.market_value; r.cards.portfolio_value = pv; r.cards.investments_value += pv; r.cards.net_worth += pv; return r; }
    if (path === "/api/restore") fail("«Cargar mis datos» funciona en tu app con servidor (PythonAnywhere); en esta vista previa no se guardan datos reales.", 501);
    if (path === "/api/demo" && method === "POST") return { ok: true, created: loadDemo(u) };
    if (path === "/api/demo" && method === "DELETE") return { ok: true, deleted: deleteDemo(u) };
    if (path === "/api/transactions.csv") return { __file: true, name: "movimientos.csv", data: csvFor(u, q) };
    if (path === "/api/export.json") {
      const out = { exported_at: new Date().toISOString(), user: userDict(u), accounts: d.accounts.filter((a) => a.user_id === u.id).map((a) => accRow(u.id, a)),
        categories: d.categories.filter((c) => c.user_id === u.id), transactions: queryTx(u.id, {}, false).rows, portfolio_ops: d.ops.filter((o) => o.user_id === u.id).map(opRow) };
      return { __file: true, name: "fipo-datos.json", data: JSON.stringify(out, null, 2) };
    }
    fail("No encontrado.", 404);
  }

  api = async function (method, url, body) {
    const snap = JSON.stringify(db());            // cada petición es atómica, como en el servidor: si falla, nada queda a medias
    try { const r = await handle(method, url, body); if (r && r.__file) return r; save(); return JSON.parse(JSON.stringify(r)); }
    catch (e) {
      mem = JSON.parse(snap);
      if (e instanceof ApiError) { if (e.status === 401 && !url.startsWith("/api/auth/")) onUnauthorized(); throw e; }
      console.error(e); throw new ApiError("Ocurrió un error inesperado. Intenta de nuevo.", 500);
    }
  };

  /* ---------- subida de archivos (lee el CSV en el navegador) ---------- */
  uploadForm = async function (url, fd) {
    const file = fd.get("file"), body = {}; fd.forEach((v, k) => { if (k !== "file") body[k] = v; });
    try { body.file = { name: file.name, text: await file.text() }; return JSON.parse(JSON.stringify(await handle("POST", url, body))); }
    catch (e) { if (e instanceof ApiError) throw e; console.error(e); throw new ApiError("No se pudo leer el archivo.", 500); }
  };

  /* ---------- descargas mediante la capacidad "downloads" del visor ---------- */
  downloadFile = async function (url) {
    try {
      const f = await handle("GET", url, {});
      const dl = await claude.use("downloads");
      if (!dl) return toast("Las descargas no están disponibles en esta vista. Prueba abriendo la página en una pestaña propia.", "error");
      await dl.save({ filename: f.name, data: f.data });
      toast("Archivo listo.");
    } catch (e) {
      if (e && e.code === "declined") return;
      toast((e && e.message) || "No se pudo descargar el archivo.", "error");
    }
  };

  /* ---------- aviso de vista previa ---------- */
  window.fipoPreviewReset = () => { resetAll(); location.hash = "#/login"; location.reload(); };
})();

const errorBox = (e, retry) => `<div class="empty"><p>${esc(e.message || "No se pudo cargar.")}</p><button class="btn" id="retry">Reintentar</button></div>`;
function withRetry(view, fn) { fn().catch((e) => { if (e.status === 401) return; view.innerHTML = errorBox(e); const b = $("#retry", view); if (b) b.onclick = () => { view.innerHTML = '<div class="spinner"></div>'; withRetry(view, fn); }; }); }

function greeting() {

  return h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
}
/* anillo del puntaje de salud financiera: muestra el valor real recibido (o "—" si no hay datos) */
function scoreRing(health) {
  const R = 50, C = 2 * Math.PI * R, v = health ? Math.max(0, Math.min(100, health.score_100)) : 0, len = (v / 100) * C;
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${health ? health.score_10.toFixed(1) + " de 10" : "Sin datos"}">
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/>
    ${health ? `<circle class="arc" cx="60" cy="60" r="${R}" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-dasharray="${len} ${C - len}" transform="rotate(-90 60 60)"/>` : ""}
    <text x="60" y="63" text-anchor="middle" class="sh-num">${health ? health.score_10.toFixed(1) : "—"}</text>
    <text x="60" y="82" text-anchor="middle" class="sh-den">de 10</text></svg>`;
}

const QUOTES = [
  ["Cuídate de los pequeños gastos; una pequeña fuga hundirá un gran barco.", "Benjamin Franklin"],
  ["El precio es lo que pagas; el valor es lo que obtienes.", "Warren Buffett"],
  ["Regla número 1: nunca pierdas dinero. Regla número 2: nunca olvides la regla número 1.", "Warren Buffett"],
  ["A largo plazo, todos estaremos muertos.", "John Maynard Keynes"],
  ["No existe tal cosa como un almuerzo gratis.", "Milton Friedman"],
  ["En el corto plazo, el mercado es una máquina de votar; en el largo plazo, es una balanza.", "Benjamin Graham"],
  ["El mayor problema del inversionista, e incluso su peor enemigo, probablemente sea él mismo.", "Benjamin Graham"],
  ["Conoce lo que posees y sabe por qué lo posees.", "Peter Lynch"],
  ["La inflación es siempre y en todas partes un fenómeno monetario.", "Milton Friedman"],
  ["Sé temeroso cuando otros son codiciosos, y codicioso cuando otros son temerosos.", "Warren Buffett"],
  ["Nuestro periodo favorito para conservar una inversión es para siempre.", "Warren Buffett"],
  ["El consumo es el único fin y propósito de toda producción.", "Adam Smith"],
];
let quoteIdx = null;
function dailyQuote() {
  if (quoteIdx == null) { const n = new Date(), d0 = new Date(n.getFullYear(), 0, 0); quoteIdx = Math.floor((n - d0) / 864e5) % QUOTES.length; }
  return QUOTES[quoteIdx];
}
const quoteHtml = ([t, a]) => `<blockquote>“${esc(t)}”</blockquote><figcaption>— ${esc(a)}</figcaption>`;
const monthName = (key) => (key ? new Intl.DateTimeFormat("es-MX", { month: "long" }).format(new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 1)) : "");

/* insight corto arriba a la derecha de una tarjeta: siempre calculado con tus datos, nunca texto fijo */
function insight(text, tone = "") {
  if (!text) return "";
  return `<span class="ins ${tone}" title="${esc(text)}">${icon(tone === "bad" ? "alert" : tone === "ok" ? "check" : "idea")}<span>${esc(text)}</span></span>`;
}
const pctTxt = (x) => (Math.round(x * 10) / 10).toString() + "%";
function heroInsight(h, C) {
  if (!h || !h.income) return "";
  const exp = h.amounts.living, r = exp / h.income;
  if (exp > h.income) return insight(`Gastaste ${money(exp - h.income, C)} más de lo que entró`, "bad");
  if (r <= 0.5) return insight(`Gasto sano: ${pctTxt(r * 100)} del ingreso`, "ok");
  return insight(`Gastas ${pctTxt(r * 100)} del ingreso · meta 50%`, "warn");
}

      <div class="field"><label for="m-from">Desde</label><input id="m-from" type="date" value="${esc(f.from)}"></div>
      <div class="field"><label for="m-to">Hasta</label><input id="m-to" type="date" value="${esc(f.to)}"></div>
      <div class="field"><label for="m-acc">Cuenta</label><select id="m-acc"><option value="">Todas</option>${accOpts}</select></div>
